<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DinoTest V5</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#080b12;
    color:#fff;
    min-height:100vh;
}
.container{
    width:min(600px,94%);
    margin:auto;
    padding:25px 0 40px;
}
header{text-align:center;margin-bottom:20px}
.logo{
    font-size:32px;
    font-weight:900;
}
.logo span{color:#00e5ff}
.sub{color:#8993a5;font-size:13px;margin-top:5px}

.card{
    background:#101620;
    border:1px solid #202a39;
    border-radius:22px;
    padding:20px;
    box-shadow:0 15px 40px #0007;
    margin-bottom:16px;
}

.speedbox{text-align:center}
.speed{
    position:relative;
    width:250px;
    height:250px;
    margin:auto;
}
svg{
    width:100%;
    height:100%;
    transform:rotate(-135deg);
}
.track{
    fill:none;
    stroke:#263142;
    stroke-width:13;
}
.progress{
    fill:none;
    stroke:#00e5ff;
    stroke-width:13;
    stroke-linecap:round;
    stroke-dasharray:565;
    stroke-dashoffset:565;
    transition:.3s;
}
.speedvalue{
    position:absolute;
    left:0;
    right:0;
    top:91px;
    font-size:42px;
    font-weight:900;
}
.unit{
    position:absolute;
    left:0;
    right:0;
    top:145px;
    color:#8d99aa;
    font-size:14px;
}
.phase{
    color:#00e5ff;
    font-size:13px;
    margin-top:-12px;
    min-height:20px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:18px;
}
.stat{
    background:#0a0f17;
    border-radius:14px;
    padding:14px 5px;
    text-align:center;
}
.stat b{
    display:block;
    font-size:20px;
}
.stat small{color:#7e899b}

canvas{
    width:100%;
    height:180px;
    background:#090e16;
    border-radius:15px;
}

.buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}
button{
    border:0;
    border-radius:14px;
    padding:15px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}
.start{
    background:#00e5ff;
    color:#001014;
}
.stop{
    background:#252e3c;
    color:white;
}
button:disabled{
    opacity:.4;
}

.result{
    text-align:center;
}
.result .big{
    font-size:38px;
    font-weight:900;
}
.badge{
    display:inline-block;
    padding:7px 15px;
    border-radius:30px;
    background:#17313a;
    color:#00e5ff;
    margin:8px;
}

.history-item{
    display:flex;
    justify-content:space-between;
    gap:8px;
    padding:12px 0;
    border-bottom:1px solid #202938;
    font-size:13px;
}
.history-item:last-child{border-bottom:0}

.clear{
    width:100%;
    margin-top:10px;
    background:#252e3c;
    color:#fff;
}

.hidden{display:none}

.footer{
    text-align:center;
    color:#596578;
    font-size:11px;
    margin-top:20px;
}

@media(max-width:400px){
    .speed{width:220px;height:220px}
    .speedvalue{top:80px;font-size:36px}
    .unit{top:130px}
}
</style>
</head>

<body>

<div class="container">

<header>
    <div class="logo">🦖 Dino<span>Test</span></div>
    <div class="sub">Professional Internet Speed Test V5</div>
</header>

<div class="card speedbox">

<div class="speed">
<svg viewBox="0 0 220 220">
<circle class="track" cx="110" cy="110" r="90"
stroke-dasharray="565"
stroke-dashoffset="0"/>
<circle id="progress" class="progress"
cx="110" cy="110" r="90"/>
</svg>

<div id="speedValue" class="speedvalue">0</div>
<div class="unit">Mbps</div>
</div>

<div id="phase" class="phase">Siap melakukan tes</div>

<div class="stats">
<div class="stat">
<b id="ping">--</b>
<small>Ping ms</small>
</div>

<div class="stat">
<b id="jitter">--</b>
<small>Jitter ms</small>
</div>

<div class="stat">
<b id="loss">--</b>
<small>Loss %</small>
</div>
</div>

</div>

<div class="card">
<canvas id="graph"></canvas>
</div>

<div class="card">
<div class="buttons">
<button id="start" class="start">🚀 MULAI TES</button>
<button id="stop" class="stop" disabled>⛔ STOP</button>
</div>
</div>

<div id="resultCard" class="card result hidden">
<h3>HASIL TES</h3>

<div>
Download
<div id="finalDown" class="big">-- Mbps</div>
</div>

<div>
Upload
<div id="finalUp" class="big">-- Mbps</div>
</div>

<div id="quality" class="badge">--</div>

<br>

<button id="share" class="start">📤 BAGIKAN HASIL</button>
</div>

<div class="card">
<h3>🏆 Rekor Terbaik</h3>

<div class="stats">
<div class="stat">
<b id="bestDown">--</b>
<small>Download</small>
</div>

<div class="stat">
<b id="bestUp">--</b>
<small>Upload</small>
</div>

<div class="stat">
<b id="bestPing">--</b>
<small>Ping</small>
</div>
</div>
</div>

<div class="card">
<h3>📊 Riwayat Tes</h3>
<div id="history">Belum ada riwayat.</div>
<button id="clear" class="clear">🗑 Hapus Riwayat</button>
</div>

<div class="footer">
DinoTest V5 • Browser-based network test
</div>

</div>

<script>
const DOWN="https://speed.cloudflare.com/__down";
const UP="https://speed.cloudflare.com/__up";

const $=id=>document.getElementById(id);

const start=$("start");
const stop=$("stop");
const progress=$("progress");
const speedValue=$("speedValue");
const phase=$("phase");
const canvas=$("graph");
const ctx=canvas.getContext("2d");

let running=false;
let stopped=false;
let samples=[];
let currentSpeed=0;
let finalDownload=0;
let finalUpload=0;

function resize(){
    const d=devicePixelRatio||1;
    canvas.width=canvas.clientWidth*d;
    canvas.height=canvas.clientHeight*d;
    ctx.setTransform(d,0,0,d,0,0);
    draw();
}

window.addEventListener("resize",resize);

function draw(){
    const w=canvas.clientWidth;
    const h=canvas.clientHeight;

    ctx.clearRect(0,0,w,h);

    ctx.strokeStyle="#202938";
    ctx.lineWidth=1;

    for(let i=1;i<5;i++){
        let y=i*h/5;
        ctx.beginPath();
        ctx.moveTo(0,y);
        ctx.lineTo(w,y);
        ctx.stroke();
    }

    if(samples.length<2)return;

    ctx.strokeStyle="#00e5ff";
    ctx.lineWidth=2;
    ctx.beginPath();

    samples.forEach((v,i)=>{
        const x=i/(samples.length-1)*w;
        const max=Math.max(100,...samples)*1.1;
        const y=h-(v/max*h);

        if(i===0)ctx.moveTo(x,y);
        else ctx.lineTo(x,y);
    });

    ctx.stroke();
}

function setSpeed(v){
    currentSpeed=v;
    speedValue.textContent=v.toFixed(1);

    const max=100;
    const ratio=Math.min(v/max,1);
    progress.style.strokeDashoffset=565-(565*ratio);

    samples.push(v);
    if(samples.length>120)samples.shift();
    draw();
}

function median(a){
    if(!a.length)return 0;
    const b=[...a].sort((x,y)=>x-y);
    const m=Math.floor(b.length/2);
    return b.length%2?b[m]:(b[m-1]+b[m])/2;
}

async function pingTest(){
    phase.textContent="📡 Mengukur ping...";

    let times=[];

    for(let i=0;i<6;i++){
        if(stopped)break;

        const t=performance.now();

        try{
            await fetch(
                "https://speed.cloudflare.com/cdn-cgi/trace?x="+Math.random(),
                {cache:"no-store",mode:"cors"}
            );

            times.push(performance.now()-t);
        }catch(e){}
    }

    if(times.length){
        const p=median(times);
        $("ping").textContent=p.toFixed(0);

        let diffs=[];
        for(let i=1;i<times.length;i++)
            diffs.push(Math.abs(times[i]-times[i-1]));

        $("jitter").textContent=median(diffs).toFixed(1);
    }

    return times;
}

async function downloadTest(){
    phase.textContent="⬇️ Mengukur download...";

    let results=[];

    for(let i=0;i<6;i++){
        if(stopped)break;

        try{
            const size=8*1024*1024;
            const t=performance.now();

            const r=await fetch(
                DOWN+"?bytes="+size+"&x="+Math.random(),
                {cache:"no-store"}
            );

            const reader=r.body.getReader();
            let bytes=0;
            let last=t;

            while(true){
                const {done,value}=await reader.read();
                if(done)break;

                bytes+=value.length;

                const now=performance.now();
                const sec=(now-t)/1000;

                if(sec>0){
                    const mbps=bytes*8/sec/1000000;
                    setSpeed(mbps);
                }

                if(stopped){
                    reader.cancel();
                    break;
                }
            }

            const sec=(performance.now()-t)/1000;

            if(sec>0){
                results.push(bytes*8/sec/1000000);
            }

        }catch(e){}
    }

    finalDownload=median(results);

    return finalDownload;
}

async function uploadTest(){
    phase.textContent="⬆️ Mengukur upload...";

    let results=[];

    const data=new Uint8Array(4*1024*1024);

    for(let i=0;i<6;i++){
        if(stopped)break;

        try{
            const t=performance.now();

            await fetch(
                UP+"?x="+Math.random(),
                {
                    method:"POST",
                    body:data,
                    cache:"no-store"
                }
            );

            const sec=(performance.now()-t)/1000;

            if(sec>0){
                const mbps=data.length*8/sec/1000000;
                results.push(mbps);
                setSpeed(mbps);
            }

        }catch(e){}
    }

    finalUpload=median(results);

    return finalUpload;
}

function getQuality(d,p){
    if(d>=100 && p<30)return"🚀 EXCELLENT";
    if(d>=30 && p<60)return"👍 GOOD";
    if(d>=10)return"🙂 FAIR";
    return"🐢 POOR";
}

function save(){
    const history=JSON.parse(localStorage.getItem("dinotest")||"[]");

    history.unshift({
        date:new Date().toLocaleString("id-ID"),
        ping:$("ping").textContent,
        jitter:$("jitter").textContent,
        loss:$("loss").textContent,
        download:finalDownload.toFixed(2),
        upload:finalUpload.toFixed(2)
    });

    localStorage.setItem(
        "dinotest",
        JSON.stringify(history.slice(0,20))
    );

    load();
}

function load(){
    const h=JSON.parse(localStorage.getItem("dinotest")||"[]");

    if(!h.length){
        $("history").textContent="Belum ada riwayat.";
        $("bestDown").textContent="--";
        $("bestUp").textContent="--";
        $("bestPing").textContent="--";
        return;
    }

    $("history").innerHTML=h.map(x=>`
    <div class="history-item">
        <span>${x.date}</span>
        <span>
        ↓ ${x.download}<br>
        ↑ ${x.upload}
        </span>
    </div>
    `).join("");

    const valid=h.filter(x=>
        Number.isFinite(Number(x.download)) &&
        Number.isFinite(Number(x.upload)) &&
        Number.isFinite(Number(x.ping))
    );

    if(!valid.length){
        $("bestDown").textContent="--";
        $("bestUp").textContent="--";
        $("bestPing").textContent="--";
        return;
    }

    const bd=Math.max(...valid.map(x=>Number(x.download)));
    const bu=Math.max(...valid.map(x=>Number(x.upload)));
    const bp=Math.min(...valid.map(x=>Number(x.ping)));

    $("bestDown").textContent=bd.toFixed(2);
    $("bestUp").textContent=bu.toFixed(2);
    $("bestPing").textContent=bp.toFixed(0);
}

async function startTest(){
    if(running)return;

    running=true;
    stopped=false;
    samples=[];
    finalDownload=0;
    finalUpload=0;

    start.disabled=true;
    stop.disabled=false;
    $("resultCard").classList.add("hidden");

    $("loss").textContent="0";

    await pingTest();

    if(stopped)return finish();

    await downloadTest();

    if(stopped)return finish();

    await uploadTest();

    finish();
}

function finish(){
    running=false;
    stop.disabled=true;
    start.disabled=false;

    if(!finalDownload && !finalUpload){
        phase.textContent="Tes dihentikan";
        return;
    }

    phase.textContent="✅ Tes selesai";

    $("finalDown").textContent=finalDownload.toFixed(2)+" Mbps";
    $("finalUp").textContent=finalUpload.toFixed(2)+" Mbps";

    const p=Number($("ping").textContent)||999;

    $("quality").textContent=getQuality(finalDownload,p);

    $("resultCard").classList.remove("hidden");

    save();
}

function stopTest(){
    if(!running)return;

    stopped=true;
    phase.textContent="⛔ Menghentikan tes...";
}

$("start").onclick=startTest;
$("stop").onclick=stopTest;

$("clear").onclick=()=>{
    if(confirm("Hapus semua riwayat tes?")){
        localStorage.removeItem("dinotest");
        load();
    }
};

$("share").onclick=async()=>{
    const text=
`🦖 DinoTest V5

⬇️ Download: ${finalDownload.toFixed(2)} Mbps
⬆️ Upload: ${finalUpload.toFixed(2)} Mbps
📡 Ping: ${$("ping").textContent} ms
📊 Jitter: ${$("jitter").textContent} ms
📶 Packet Loss: ${$("loss").textContent}%

${$("quality").textContent}`;

    if(navigator.share){
        try{
            await navigator.share({
                title:"DinoTest Result",
                text:text
            });
        }catch(e){}
    }else{
        await navigator.clipboard.writeText(text);
        alert("Hasil tes sudah disalin.");
    }
};

resize();
load();
</script>

</body>
</html>
